name: Build Application Images

on:
  push:
    branches:
      - devsecops/github-actions
      - main

permissions:
  contents: read

concurrency:
  group: wanderlust-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, wanderlust]
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Docker and disk space
        run: |
          docker version
          df -h /

      - name: Gitleaks secret scan
        id: gitleaks
        run: |
          REPORT_DIR="$RUNNER_TEMP/gitleaks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$REPORT_DIR:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --gitleaks-ignore-path=/repo/.gitleaksignore \
            --log-opts="--all" \
            --redact=100 \
            --report-format=json \
            --report-path=/reports/gitleaks-report.json \
            --exit-code=1

      - name: Upload redacted Gitleaks report
        if: ${{ always() && steps.gitleaks.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-${{ github.run_id }}-${{ github.run_attempt }}/gitleaks-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit npm dependencies
        id: npm_audit
        run: |
          REPORT_DIR="$RUNNER_TEMP/npm-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR"

          docker pull node:22-bookworm-slim

          audit_failed=0

          for app in backend frontend; do
            echo "::group::Dependency audit - $app"

            if docker run --rm \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -e HOME=/tmp \
              -e npm_config_cache=/tmp/npm-cache \
              -v "$GITHUB_WORKSPACE/$app:/app:ro" \
              -w /app \
              node:22-bookworm-slim \
              npm audit \
                --package-lock-only \
                --include=dev \
                --ignore-scripts \
                --audit-level=high \
                --json \
                > "$REPORT_DIR/$app-audit.json"; then
              echo "$app: dependency audit passed."
            else
              scan_status=$?
              if [ "$scan_status" -ne 1 ]; then
                audit_failed=1
                echo "::error::$app scanner execution failed: $scan_status"
              fi
            fi

            if docker run --rm \
              --network none \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              -v "$REPORT_DIR:/reports:ro" \
              node:22-bookworm-slim \
              node /repo/scripts/security/check-npm-audit.cjs \
                "/reports/$app-audit.json" \
                "/repo/$app/package-lock.json"; then
              echo "$app: audit policy passed."
            else
              audit_failed=1
              echo "::error::$app audit policy failed."
            fi

            cat "$REPORT_DIR/$app-audit.json"
            echo "::endgroup::"
          done

          exit "$audit_failed"

      - name: Upload npm audit reports
        if: ${{ always() && steps.npm_audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-audit-${{ github.run_id }}-${{ github.run_attempt }}/*-audit.json
          retention-days: 7
          if-no-files-found: warn

      - name: Check SonarQube connection
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -euo pipefail
          test -n "$SONAR_TOKEN" || {
            echo "::error::SONAR_TOKEN is missing"
            exit 1
          }
          test -n "$SONAR_HOST_URL" || {
            echo "::error::SONAR_HOST_URL is missing"
            exit 1
          }
          curl --fail --silent --show-error --max-time 15 \
            "${SONAR_HOST_URL%/}/api/system/status" |
            python3 -c 'import json,sys; data=json.load(sys.stdin); print("SonarQube status:", data.get("status")); sys.exit(0 if data.get("status") == "UP" else 1)'
          free -h

      - name: SonarQube analysis and Quality Gate
        id: sonar_scan
        timeout-minutes: 20
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_SCANNER_JAVA_OPTS: "-Xmx512m"
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.javascript.node.maxspace=512

      - name: Build backend image
        run: |
          docker build --pull --progress=plain \
            --tag "wanderlust-backend:${GITHUB_SHA}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build --pull --progress=plain \
            --tag "wanderlust-frontend:${GITHUB_SHA}" \
            ./frontend

      - name: Scan container images with Trivy
        id: trivy
        timeout-minutes: 25
        run: |
          REPORT_DIR="$RUNNER_TEMP/trivy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR/cache"
          trap 'rm -f "$REPORT_DIR/image.tar"' EXIT

          docker pull aquasec/trivy:0.76.0

          scan_failed=0

          for app in backend frontend; do
            echo "::group::Trivy scan - $app"

            if ! docker save \
              --output "$REPORT_DIR/image.tar" \
              "wanderlust-$app:$GITHUB_SHA"; then
              scan_failed=1
              echo "::error::Could not export $app image."
              echo "::endgroup::"
              continue
            fi

            if docker run --rm \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -e HOME=/tmp \
              -v "$REPORT_DIR:/scan" \
              aquasec/trivy:0.76.0 \
              image \
              --input /scan/image.tar \
              --cache-dir /scan/cache \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --format json \
              --output "/scan/$app-trivy.json" \
              --exit-code 1 \
              --timeout 10m \
              --no-progress; then
              echo "$app: Trivy scan passed."
            else
              scan_failed=1
              echo "::error::$app Trivy scan failed. Check findings and scanner logs."
            fi

            rm -f "$REPORT_DIR/image.tar"
            echo "::endgroup::"
          done

          exit "$scan_failed"

      - name: Upload Trivy reports
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: trivy-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-${{ github.run_id }}-${{ github.run_attempt }}/*-trivy.json
          retention-days: 7
          if-no-files-found: warn

      - name: Runtime smoke test
        id: runtime_smoke
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          PREFIX="wl-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="wanderlust-backend:${GITHUB_SHA}"

          cleanup() {
            status=$?
            trap - EXIT
            set +e
            if [ "$status" -ne 0 ]; then
              for service in mongo redis backend frontend; do
                echo "::group::Smoke logs - $service"
                docker logs --tail 80 "$PREFIX-$service" 2>&1
                echo "::endgroup::"
              done
            fi
            for service in probe frontend backend redis mongo; do
              docker rm -fv "$PREFIX-$service" >/dev/null 2>&1
            done
            docker network rm "$PREFIX" >/dev/null 2>&1
            exit "$status"
          }
          trap cleanup EXIT

          docker pull mongo:7
          docker pull redis:7-alpine
          docker network create --internal "$PREFIX"

          docker run -d --name "$PREFIX-mongo" \
            --network "$PREFIX" --network-alias mongo mongo:7

          docker run -d --name "$PREFIX-redis" \
            --network "$PREFIX" --network-alias redis \
            redis:7-alpine redis-server --save "" --appendonly no

          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$PREFIX-mongo" mongosh --quiet \
                --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)' \
                >/dev/null 2>&1 \
              && [ "$(docker exec "$PREFIX-redis" redis-cli ping 2>/dev/null)" = "PONG" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1 || { echo "::error::Test databases not ready"; exit 1; }

          docker run -d --name "$PREFIX-backend" \
            --network "$PREFIX" --network-alias backend \
            --cap-drop ALL --security-opt no-new-privileges \
            -e PORT=8080 \
            -e MONGODB_URI=mongodb://mongo:27017/wanderlust_smoke \
            -e REDIS_URL=redis://redis:6379 \
            "$IMAGE"

          docker run -d --name "$PREFIX-frontend" \
            --network "$PREFIX" --network-alias frontend \
            --cap-drop ALL --security-opt no-new-privileges \
            "wanderlust-frontend:${GITHUB_SHA}"

          docker run --rm -i --name "$PREFIX-probe" \
            --network "$PREFIX" \
            --cap-drop ALL --security-opt no-new-privileges \
            "$IMAGE" --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';
          import { createClient } from 'redis';
          import { REDIS_PREFIX, REDIS_KEYS } from './utils/constants.js';

          const deadline = setTimeout(() => {
            console.error('FAIL: Smoke test exceeded 180 seconds');
            process.exit(1);
          }, 180000);

          async function get(url) {
            const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
            assert.equal(response.status, 200, `${url}: expected HTTP 200`);
            return response;
          }

          async function check(name, fn) {
            let lastError;
            for (let attempt = 0; attempt < 20; attempt++) {
              try {
                await fn();
                console.log(`PASS: ${name}`);
                return;
              } catch (error) {
                lastError = error;
                await delay(1000);
              }
            }
            throw new Error(`${name}: ${lastError?.message}`);
          }

          let redis;
          try {
            await check('Backend startup', async () => {
              assert.match(await (await get('http://backend:8080/')).text(),
                /Backend of wanderlust/);
            });

            await check('MongoDB-backed posts API', async () => {
              assert.deepEqual(await (await get('http://backend:8080/api/posts')).json(), []);
            });

            await check('Frontend health endpoint', async () => {
              assert.equal((await (await get('http://frontend:8080/healthz')).text()).trim(), 'ok');
            });

            await check('Frontend HTML', async () => {
              const response = await get('http://frontend:8080/');
              assert.match(response.headers.get('content-type') || '', /text\/html/);
              assert.match(await response.text(), /<html[\s>]/i);
            });

            await check('Nginx API proxy', async () => {
              assert.deepEqual(await (await get('http://frontend:8080/api/posts')).json(), []);
            });

            redis = createClient({
              url: 'redis://redis:6379',
              socket: { connectTimeout: 5000, reconnectStrategy: false }
            });
            redis.on('error', error => console.error('Redis probe:', error.message));
            await redis.connect();

            await check('Application populates Redis cache', async () => {
              assert.deepEqual(await (await get('http://backend:8080/api/posts')).json(), []);
              const cached = await redis.get(`${REDIS_PREFIX}:${REDIS_KEYS.ALL_POSTS}`);
              assert.notEqual(cached, null, 'Posts cache key missing');
              assert.deepEqual(JSON.parse(cached), []);
            });
          } catch (error) {
            console.error(`FAIL: ${error.message}`);
            process.exitCode = 1;
          } finally {
            if (redis?.isOpen) await redis.disconnect();
            clearTimeout(deadline);
          }
          JS

          for service in backend frontend; do
            test "$(docker inspect --format '{{.State.Running}}' "$PREFIX-$service")" = "true"
          done
          echo "Runtime smoke test passed." >> "$GITHUB_STEP_SUMMARY"


      - name: Cleanup smoke test resources
        if: ${{ always() && steps.runtime_smoke.outcome != 'skipped' }}
        run: |
          PREFIX="wl-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for service in probe frontend backend redis mongo; do
            if docker container inspect "$PREFIX-$service" >/dev/null 2>&1; then
              docker rm -fv "$PREFIX-$service"
            fi
          done
          if docker network inspect "$PREFIX" >/dev/null 2>&1; then
            docker network rm "$PREFIX"
          fi

      - name: Record build results
        run: |
          {
            echo "## Application images built"
            echo ""
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo '```text'
            docker image inspect \
              "wanderlust-backend:${GITHUB_SHA}" \
              "wanderlust-frontend:${GITHUB_SHA}" \
              --format '{{.RepoTags}} | user={{.Config.User}} | size={{.Size}} bytes'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
