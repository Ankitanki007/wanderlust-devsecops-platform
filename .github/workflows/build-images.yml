name: Build Application Images

on:
  push:
    branches:
      - devsecops/github-actions
      - main

permissions:
  contents: read

concurrency:
  group: wanderlust-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, wanderlust]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Docker and disk space
        run: |
          docker version
          df -h /

      - name: Gitleaks secret scan
        id: gitleaks
        run: |
          REPORT_DIR="$RUNNER_TEMP/gitleaks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$REPORT_DIR:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --gitleaks-ignore-path=/repo/.gitleaksignore \
            --log-opts="--all" \
            --redact=100 \
            --report-format=json \
            --report-path=/reports/gitleaks-report.json \
            --exit-code=1

      - name: Upload redacted Gitleaks report
        if: ${{ always() && steps.gitleaks.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-${{ github.run_id }}-${{ github.run_attempt }}/gitleaks-report.json
          retention-days: 7
          if-no-files-found: warn

      - name: Build backend image
        run: |
          docker build --pull --progress=plain \
            --tag "wanderlust-backend:${GITHUB_SHA}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build --pull --progress=plain \
            --tag "wanderlust-frontend:${GITHUB_SHA}" \
            ./frontend

      - name: Record build results
        run: |
          {
            echo "## Application images built"
            echo ""
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo '```text'
            docker image inspect \
              "wanderlust-backend:${GITHUB_SHA}" \
              "wanderlust-frontend:${GITHUB_SHA}" \
              --format '{{.RepoTags}} | user={{.Config.User}} | size={{.Size}} bytes'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
