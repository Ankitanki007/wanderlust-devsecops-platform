name: Build Application Images

on:
  push:
    branches:
      - devsecops/github-actions
      - main

permissions:
  contents: read

concurrency:
  group: wanderlust-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, wanderlust]
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check Docker and disk space
        run: |
          docker version
          df -h /

      - name: Gitleaks secret scan
        id: gitleaks
        run: |
          REPORT_DIR="$RUNNER_TEMP/gitleaks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$REPORT_DIR:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --gitleaks-ignore-path=/repo/.gitleaksignore \
            --log-opts="--all" \
            --redact=100 \
            --report-format=json \
            --report-path=/reports/gitleaks-report.json \
            --exit-code=1

      - name: Upload redacted Gitleaks report
        if: ${{ always() && steps.gitleaks.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gitleaks-${{ github.run_id }}-${{ github.run_attempt }}/gitleaks-report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Audit npm dependencies
        id: npm_audit
        run: |
          REPORT_DIR="$RUNNER_TEMP/npm-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR"

          docker pull node:22-bookworm-slim

          audit_failed=0

          for app in backend frontend; do
            echo "::group::Dependency audit - $app"

            if docker run --rm \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -e HOME=/tmp \
              -e npm_config_cache=/tmp/npm-cache \
              -v "$GITHUB_WORKSPACE/$app:/app:ro" \
              -w /app \
              node:22-bookworm-slim \
              npm audit \
                --package-lock-only \
                --include=dev \
                --ignore-scripts \
                --audit-level=high \
                --json \
                > "$REPORT_DIR/$app-audit.json"; then
              echo "$app: dependency audit passed."
            else
              scan_status=$?
              if [ "$scan_status" -ne 1 ]; then
                audit_failed=1
                echo "::error::$app scanner execution failed: $scan_status"
              fi
            fi

            if docker run --rm \
              --network none \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              -v "$REPORT_DIR:/reports:ro" \
              node:22-bookworm-slim \
              node /repo/scripts/security/check-npm-audit.cjs \
                "/reports/$app-audit.json" \
                "/repo/$app/package-lock.json"; then
              echo "$app: audit policy passed."
            else
              audit_failed=1
              echo "::error::$app audit policy failed."
            fi

            cat "$REPORT_DIR/$app-audit.json"
            echo "::endgroup::"
          done

          exit "$audit_failed"

      - name: Upload npm audit reports
        if: ${{ always() && steps.npm_audit.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-audit-${{ github.run_id }}-${{ github.run_attempt }}/*-audit.json
          retention-days: 7
          if-no-files-found: warn

      - name: Build backend image
        run: |
          docker build --pull --progress=plain \
            --tag "wanderlust-backend:${GITHUB_SHA}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build --pull --progress=plain \
            --tag "wanderlust-frontend:${GITHUB_SHA}" \
            ./frontend

      - name: Scan container images with Trivy
        id: trivy
        timeout-minutes: 25
        run: |
          REPORT_DIR="$RUNNER_TEMP/trivy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR/cache"
          trap 'rm -f "$REPORT_DIR/image.tar"' EXIT

          docker pull aquasec/trivy:0.76.0

          scan_failed=0

          for app in backend frontend; do
            echo "::group::Trivy scan - $app"

            if ! docker save \
              --output "$REPORT_DIR/image.tar" \
              "wanderlust-$app:$GITHUB_SHA"; then
              scan_failed=1
              echo "::error::Could not export $app image."
              echo "::endgroup::"
              continue
            fi

            if docker run --rm \
              --user "$(id -u):$(id -g)" \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -e HOME=/tmp \
              -v "$REPORT_DIR:/scan" \
              aquasec/trivy:0.76.0 \
              image \
              --input /scan/image.tar \
              --cache-dir /scan/cache \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --format json \
              --output "/scan/$app-trivy.json" \
              --exit-code 1 \
              --timeout 10m \
              --no-progress; then
              echo "$app: Trivy scan passed."
            else
              scan_failed=1
              echo "::error::$app Trivy scan failed. Check findings and scanner logs."
            fi

            rm -f "$REPORT_DIR/image.tar"
            echo "::endgroup::"
          done

          exit "$scan_failed"

      - name: Upload Trivy reports
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        uses: actions/upload-artifact@v6
        with:
          name: trivy-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy-${{ github.run_id }}-${{ github.run_attempt }}/*-trivy.json
          retention-days: 7
          if-no-files-found: warn

      - name: Record build results
        run: |
          {
            echo "## Application images built"
            echo ""
            echo "Commit: ${GITHUB_SHA}"
            echo ""
            echo '```text'
            docker image inspect \
              "wanderlust-backend:${GITHUB_SHA}" \
              "wanderlust-frontend:${GITHUB_SHA}" \
              --format '{{.RepoTags}} | user={{.Config.User}} | size={{.Size}} bytes'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
