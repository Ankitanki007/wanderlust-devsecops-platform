apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: wanderlust
data:
  01-create-user.js: |
    const appDb = db.getSiblingDB("wanderlust");
    appDb.createUser({
      user: "wanderlust",
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: "readWrite", db: "wanderlust" }]
    });
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: wanderlust
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: wanderlust
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: mongo:7.0
          args:
            - --wiredTigerCacheSizeGB
            - "0.25"
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-auth
                  key: root-password
            - name: MONGO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-auth
                  key: app-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - |
                  const d = db.getSiblingDB("wanderlust");
                  if (!d.auth("wanderlust", process.env.MONGO_APP_PASSWORD)) quit(1);
                  quit(d.runCommand({ping: 1}).ok === 1 ? 0 : 1);
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
        - name: init
          configMap:
            name: mongo-init
