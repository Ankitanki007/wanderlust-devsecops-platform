apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: application-deployer
  namespace: wanderlust
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["backend", "frontend"]
    verbs: ["get", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: application-deployer
  namespace: wanderlust
subjects:
  - kind: Group
    name: wanderlust-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: application-deployer
  apiGroup: rbac.authorization.k8s.io
